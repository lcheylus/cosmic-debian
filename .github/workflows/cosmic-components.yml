name: Build packages for COSMIC components
on: workflow_dispatch

jobs:
  cosmic-build:
    name: Build ${{ matrix.component }}
    env:
      VERSION: 1.4.0
      ARCH: amd64
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # component: [cosmic-randr, cosmic-screenshot, cosmic-files, cosmic-monitor, cosmic-term]
        component: [cosmic-randr, cosmic-screenshot, cosmic-monitor]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          # TODO add exception for cosmic-workspaces (repo = pop-os/cosmic-workspaces-epoch)
          repository: 'pop-os/${{ matrix.component }}'
          ref: 'epoch-${{ env.VERSION }}'

      - name: Build package
        uses: jtdor/build-deb-action@v1
        env:
          DEB_BUILD_OPTIONS: noautodbgsym
        with:
          docker-image: debian:testing
          extra-build-deps: devscripts
          # Replace build target in debian/rules files + no vendoring
          setup-hook: sed -i 's/export VENDOR ?= 1/export VENDOR ?= 0/' debian/rules && sed -i 's/build-vendored/build-release/' debian/rules && cat debian/rules
          # TODO
          # - Copy debian/changelog from repository
          # - Commit debian/changelog after release to keep changes
          # - Do not update changelog if not needed
          before-build-hook: |
            DEBEMAIL=foxy@free.fr DEBFULLNAME="Laurent Cheylus" dch -v ${{ env.VERSION }}  "Release for COSMIC epoch-${{ env.VERSION }}"
          buildpackage-opts: --build=binary --no-sign

      - name: Get infos/contents for package
        run: |
          echo "::group::Get infos for ${{ matrix.component }} package"
          dpkg --info debian/artifacts/${{ matrix.component }}_${{ env.VERSION }}_${{ env.ARCH }}.deb
          echo "::endgroup::"
          echo "::group::Get contents for ${{ matrix.component }} package"
          dpkg --contents debian/artifacts/${{ matrix.component }}_${{ env.VERSION }}_${{ env.ARCH }}.deb
          echo "::endgroup::"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          path: debian/artifacts/${{ matrix.component }}_${{ env.VERSION }}_${{ env.ARCH }}.deb
          if-no-files-found: error
          retention-days: 1
          archive: false
