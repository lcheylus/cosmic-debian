name: Build COSMIC depends
on: workflow_dispatch

permissions: {}

# Prevents concurrent runs of the workflow
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {name: adw-gtk3, repo: adw-gtk3, version: 5.3.0-0pop1 }
          - {name: appstream-data-pop, repo: appstream-data, version: 0.0.3 }
          - {name: pop-icon-theme, repo: icon-theme, version: 3.5.1 }
          - {name: pop-fonts, repo: fonts, version: 1.0.3 }
          - {name: pop-sound-theme, repo: gtk-theme, version: 5.5.1 }

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          repository: 'pop-os/${{ matrix.repo }}'
          persist-credentials: false

      - name: Build package
        uses: jtdor/build-deb-action@473136f14a42a231124c1f7cefaedfe941203c38  #v1.9.1
        with:
          docker-image: debian:testing
          buildpackage-opts: --build=binary --no-sign

      - name: Get infos/contents for packages
        run: |
          if [ "${{ matrix.name }}" == "appstream-data-pop" ]; then
            echo "::group::Get infos for ${{ matrix.name }} package"
            dpkg --info debian/artifacts/${{ matrix.name }}_${{ matrix.version }}_all.deb
            echo "::endgroup::"
            echo "::group::Get contents for ${{ matrix.name }} package"
            dpkg --contents debian/artifacts/${{ matrix.name }}_${{ matrix.version }}_all.deb
            echo "::endgroup::"
            echo "::group::Get infos for ${{ matrix.name }}-icons package"
            dpkg --info debian/artifacts/${{ matrix.name }}-icons_${{ matrix.version }}_all.deb
            echo "::endgroup::"
            echo "::group::Get contents for ${{ matrix.name }}-icons package"
            dpkg --contents debian/artifacts/${{ matrix.name }}-icons_${{ matrix.version }}_all.deb
            echo "::endgroup::"
            echo "::group::Get infos for ${{ matrix.name }}-icons-hidpi package"
            dpkg --info debian/artifacts/${{ matrix.name }}-icons-hidpi_${{ matrix.version }}_all.deb
            echo "::endgroup::"
            echo "::group::Get contents for ${{ matrix.name }}-icons-hidpi package"
            dpkg --contents debian/artifacts/${{ matrix.name }}-icons-hidpi_${{ matrix.version }}_all.deb
            echo "::endgroup::"
          else
            echo "::group::Get infos for ${{ matrix.name }} package"
            dpkg --info debian/artifacts/${{ matrix.name }}_${{ matrix.version }}_all.deb
            echo "::endgroup::"
            echo "::group::Get contents for ${{ matrix.name }} package"
            dpkg --contents debian/artifacts/${{ matrix.name }}_${{ matrix.version }}_all.deb
            echo "::endgroup::"
          fi

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  #v7.0.1
        with:
          path: debian/artifacts/${{ matrix.name }}_${{ matrix.version }}_all.deb
          if-no-files-found: error
          retention-days: 7
          archive: false

      # Multiple packages for appstream-data-pop
      - name: Upload appstream-data-pop-icons
        if: ${{ matrix.name == 'appstream-data-pop' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  #v7.0.1
        with:
          path: debian/artifacts/${{ matrix.name }}-icons_${{ matrix.version }}_all.deb
          if-no-files-found: error
          retention-days: 7
          archive: false
      - name: Upload appstream-data-pop-icons-hidpi
        if: ${{ matrix.name == 'appstream-data-pop' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  #v7.0.1
        with:
          path: debian/artifacts/${{ matrix.name }}-icons-hidpi_${{ matrix.version }}_all.deb
          if-no-files-found: error
          retention-days: 7
          archive: false
