# Temp job to install/test sccache in container
name: Test sccache
on: workflow_dispatch

jobs:
  test-sccache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources for cosmic-randr
        uses: actions/checkout@v7
        with:
          repository: 'pop-os/cosmic-randr'
          ref: 'epoch-1.4.0'

      - name: Checkout sccache from local repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: utils/sccache
          sparse-checkout-cone-mode: false
          path: tools

      - name: Setup sccache
        id: sccache-setup
        uses: mozilla-actions/sccache-action@v0.0.10
        continue-on-error: true
      - name: Export sccache
        if: steps.sccache-setup.outcome == 'success'
        run: |
          echo "RUSTC_WRAPPER=/github/workspace/tools/utils/sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

      - name: Build package
        uses: jtdor/build-deb-action@v1
        env:
          DEB_BUILD_OPTIONS: noautodbgsym
        with:
          docker-image: debian:testing
          before-build-hook: |
            echo "## pwd"
            pwd
            echo "## sccache infos"
            ls -l
            ls -l tools/utils
            tools/utils/sccache -h
          buildpackage-opts: --build=binary --no-sign
