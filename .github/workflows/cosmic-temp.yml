name: Test workflow to update changelog
on: workflow_dispatch

jobs:
  update-changelog:
    permissions:  # Allow to commit file
      contents: write
    env:
      NAME: cosmic-randr
      VERSION: 1.4.0
      ARCH: amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources for ${{ env.NAME }}
        uses: actions/checkout@v7
        with:
          repository: 'pop-os/${{ env.NAME }}'
          ref: 'epoch-${{ env.VERSION }}'

      - name: Checkout changelog for ${{ env.NAME }}
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            changelog
            utils/commit-file.sh
          path: local

      - name: Check checkouts
        run: |
          pwd
          ls -l
          if [ -d "local" ]; then
            ls -R local
          fi
          filename="local/changelog/${{ env.NAME }}"
          if [ -r "$filename" ]; then
            echo "### changelog file"
            cat "$filename"
          else
            echo "ERROR: no changelog file for ${{ env.NAME }}"
            exit 1
          fi
          echo "### check Git remote"
          cd local
          git remote -v

      - name: Update changelog for ${{ env.NAME }}
        run: |
          sudo apt install -y devscripts
          cp "local/changelog/${{ env.NAME }}" debian/changelog
          DEBEMAIL=foxy@free.fr DEBFULLNAME="Laurent Cheylus" dch -v 1.5.0  --distribution testing --release-heuristic log "Release for COSMIC epoch-1.5.0"
          cat debian/changelog

      - name: Commit changelog for ${{ env.NAME }}
        run: |
          cp debian/changelog "local/changelog/${{ env.NAME }}"
          local/utils/commit-file.sh "local/changelog/${{ env.NAME }}" "Update changelog for ${{ env.NAME }} - version ${{ env.VERSION }}"
