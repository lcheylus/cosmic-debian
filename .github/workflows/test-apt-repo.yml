# GH workflow to test creation of a Debian APT repository
name: Publish COSMIC APT Repository

on: workflow_dispatch

permissions: {}

# Prevents concurrent runs of the workflow
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  download-artifact:
    name: Download COSMIC artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPENDS_TAG: depends-20260808  # Tag for release of COSMIC Depends

    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          persist-credentials: false

      - name: Download artifacts from latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p packages
          gh release download --pattern '*.deb' --dir packages

      - name: Check downloaded artifacts from latest release
        run: |
          ls -l packages/*.deb
          count=$(find packages -maxdepth 1 -type f -name '*.deb' | wc -l)
          # 22 artifacts for components + 6 apps
          if [ "$count" -ne  28 ]; then
            echo "ERROR: Expected 28 .deb files, found $count"
            exit 1
          fi

      - name: Download artifacts from depends release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p depends
          gh release download ${{ env.DEPENDS_TAG }} --pattern '*.deb' --dir depends

      - name: Check downloaded artifacts from depends release
        run: |
          ls -l depends/*.deb
          count=$(find depends -maxdepth 1 -type f -name '*.deb' | wc -l)
          if [ "$count" -ne  7 ]; then
            echo "ERROR: Expected 7 .deb files, found $count"
            exit 1
          fi
